services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: driverdirect
      POSTGRES_USER: driverdirect
      POSTGRES_PASSWORD: driverdirect
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U driverdirect -d driverdirect"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
